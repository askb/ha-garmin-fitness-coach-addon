name: Build and Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  PULSECOACH_APP_REPO: askb/ha-garmin-fitness-coach-app
  GARMIN_COACH_REF: main

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # Native ARM runners, not QEMU. Emulated aarch64 could only finish inside
    # the 120-minute budget on a warm layer cache; GHA evicts caches after 7
    # days, so any gap in activity turned every build -- and every dependabot
    # PR -- into a 2-hour timeout. Free for public repos.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout garmin-coach app
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: ${{ env.PULSECOACH_APP_REPO }}
          ref: ${{ env.GARMIN_COACH_REF }}
          path: pulsecoach/garmin-coach
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read build config
        id: config
        run: |
          BUILD_FROM=$(jq -r ".build_from.${{ matrix.arch }}" pulsecoach/build.json)
          VERSION=$(jq -r '.version' pulsecoach/config.json)
          echo "build_from=${BUILD_FROM}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: pulsecoach
          file: pulsecoach/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pulsecoach-addon-${{ matrix.arch }}:${{ steps.config.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/pulsecoach-addon-${{ matrix.arch }}:latest
          build-args: |
            BUILD_FROM=${{ steps.config.outputs.build_from }}
            BUILD_ARCH=${{ matrix.arch }}
            CACHEBUST=${{ github.sha }}
          platforms: ${{ matrix.arch == 'aarch64' && 'linux/arm64' || 'linux/amd64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # NOTE: Release creation is handled by .github/workflows/release.yaml
  # which includes SBOM scanning and per-arch image builds.
  # This job is intentionally disabled to avoid duplicate releases.
  # release:
  #   name: Create Release
  #   needs: build
  #   if: startsWith(github.ref, 'refs/tags/v')
  #   ...
