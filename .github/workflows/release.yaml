name: 'Release'

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  gate:
    name: 'Release Gate'
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read

  validate:
    name: 'Validate'
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: 'audit'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'ShellCheck'
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # master

      - name: 'YAML lint'
        run: |
          pip install yamllint
          yamllint .

      - name: 'Validate JSON configs'
        run: |
          python3 -m json.tool pulsecoach/config.json > /dev/null
          python3 -m json.tool pulsecoach/build.json > /dev/null
          python3 -m json.tool repository.json > /dev/null

      - name: 'Lint Dockerfile'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: pulsecoach/Dockerfile

  build-push:
    name: 'Build & Push (${{ matrix.arch }})'
    # Native ARM runners, not QEMU -- see the note in build.yml. A cold
    # emulated aarch64 build cannot finish inside 120 minutes, which is why
    # no release has shipped since v0.26.0.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: validate
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            build_from: ghcr.io/home-assistant/amd64-base:3.21
          - arch: aarch64
            platform: linux/arm64
            build_from: ghcr.io/home-assistant/aarch64-base:3.21
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: 'audit'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: 'Login to GHCR'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Extract version from tag'
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: 'Build and push arch image'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: pulsecoach
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
            BUILD_ARCH=${{ matrix.arch }}
            CACHEBUST=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pulsecoach-addon-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/pulsecoach-addon-${{ matrix.arch }}:latest
          labels: |
            org.opencontainers.image.title=PulseCoach HA Addon
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sbom-scan:
    name: 'SBOM & Security Scan'
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: write
      packages: read
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: 'audit'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Login to GHCR'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Extract version from tag'
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: 'Generate SBOM from image'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/pulsecoach-addon-amd64:${{ steps.version.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json

      - name: 'Grype vulnerability scan'
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        with:
          sbom: sbom-cyclonedx.json
          output-format: 'table'
          fail-build: 'false'
          config: '.grype.yaml'

      - name: 'Upload SBOM'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-files
          path: sbom-cyclonedx.json
          retention-days: 90

  release:
    name: 'Create Release'
    runs-on: ubuntu-latest
    needs: [validate, build-push, sbom-scan]
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: 'audit'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Download SBOM'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom-files
          path: sbom/

      - name: 'Create GitHub Release'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          generate_release_notes: true
          files: sbom/sbom-cyclonedx.json
